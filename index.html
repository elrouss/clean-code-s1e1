<!DOCTYPE html>
<html lang="en">
<head>
	<title>Todo App</title>
	<link
		href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
		rel="stylesheet"
	>
	<link
		rel="stylesheet"
		href="style.css"
		media="screen"
		charset="utf-8"
	>
</head>
<body class="body">
	<header class="header">
		<img class="img" src="./eisenhower-matrix.jpg">
		<a
			class="more-info"
			href="https://goal-life.com/page/method/matrix-eisenhower"
		>
			Want more details?
		</a>
	</header>
	<main class="main">
		<section>
			<label class="label" for="new-task">Add Item</label>
			<div class="task-row-wrapper">
				<input id="new-task" class="input task" type="text">
				<button class="button">Add</button>
			</div>
		</section>
		<section>
			<h2 class="heading">Todo</h2>
			<ul id="incomplete-tasks" class="list">
				<li class="list__item">
					<input class="input" type="checkbox">
					<label class="label task">Pay Bills</label>
					<input class="input task" type="text">
					<button class="button edit-button">Edit</button>
					<button class="button delete-button">
						<img class="img" src="./remove.svg">
					</button>
				</li>
				<li class="list__item edit-mode">
					<input class="input" type="checkbox">
					<label class="label task">Go Shopping</label>
					<input class="input task" type="text" value="Go Shopping">
					<button class="button edit-button">Save</button>
					<button class="button delete-button">
						<img class="img" src="./remove.svg">
					</button>
				</li>
			</ul>
		</section>
		<section>
			<h2 class="heading">Completed</h2>
			<ul id="completed-tasks" class="list">
				<li class="list__item">
					<input class="input" type="checkbox" checked>
					<label class="label task">See the Doctor</label>
					<input class="input task" type="text">
					<button class="button edit-button">Edit</button>
					<button class="button delete-button">
						<img class="img" src="./remove.svg">
					</button>
				</li>
			</ul>
		</section>
	</main>
	<script src="app.js"></script>
</body>
</html>
